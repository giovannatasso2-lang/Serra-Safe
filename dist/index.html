<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4d34">
<meta name="color-scheme" content="light dark">
<title>Serra Safe</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: app de celular em coluna única. Cabeçalho fixo com marca e três indicadores reais (conexão, GPS, mapa), conteúdo por telas e barra de navegação inferior. */
:root{
  --bg:#f4efe3; --surface:#fffdf8; --surface2:#ebe4d2; --fg:#1f2a22; --muted:#55604f;
  --forest:#1f4d34; --on-forest:#f4efe3; --earth:#8a5026; --line:#d2c8ae;
  --ok:#256b43; --warn:#9a4a05; --danger:#a32a1f; --info:#235c8a;
  --map-bg:#e6e0c9; --map-line:#cfc6a6;
  --font-display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --font-body:"Public Sans","Segoe UI",system-ui,sans-serif;
  --s1:.25rem; --s2:.5rem; --s3:.75rem; --s4:1rem; --s5:1.5rem; --s6:2rem;
  --r-card:14px; --r-ctl:12px;
  --t-xs:.8125rem; --t-sm:.9375rem; --t-md:1rem; --t-lg:1.25rem; --t-xl:1.75rem;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141c16; --surface:#1d2820; --surface2:#26342a; --fg:#ece6d6; --muted:#aab4a5;
  --forest:#7fbf92; --on-forest:#10200f; --earth:#d89a68; --line:#35463b;
  --ok:#6cc58c; --warn:#f0a35e; --danger:#ff8f80; --info:#8fc1ea;
  --map-bg:#222c22; --map-line:#37443a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141c16; --surface:#1d2820; --surface2:#26342a; --fg:#ece6d6; --muted:#aab4a5;
  --forest:#7fbf92; --on-forest:#10200f; --earth:#d89a68; --line:#35463b;
  --ok:#6cc58c; --warn:#f0a35e; --danger:#ff8f80; --info:#8fc1ea;
  --map-bg:#222c22; --map-line:#37443a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:var(--t-md)/1.55 var(--font-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 6.5rem}
.wrap{max-width:680px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:var(--t-xl);font-weight:800}h2{font-size:var(--t-lg);font-weight:800}h3{font-size:var(--t-md);font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--forest)}
:focus-visible{outline:3px solid var(--earth);outline-offset:2px}
.skip{position:absolute;left:-999px;top:0;background:var(--forest);color:var(--on-forest);padding:var(--s3) var(--s4);border-radius:0 0 var(--r-ctl) 0;z-index:30}
.skip:focus{left:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:19;background:var(--bg);padding:var(--s3) 0 var(--s2);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:var(--s2)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:var(--s3)}
.brand{font-family:var(--font-display);font-weight:800;font-size:1.25rem;color:var(--forest);display:flex;align-items:center;gap:var(--s2)}
.brand svg{width:30px;height:30px}
.hbtns{display:flex;gap:var(--s2)}
.status{display:flex;gap:var(--s2);flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;min-height:36px;padding:0 9px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);font-size:.75rem;font-weight:600;white-space:nowrap}
button.chip{min-height:44px}
.chip svg{width:16px;height:16px;flex:none}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.chip.warn{border-color:var(--warn);color:var(--warn)}
.chip.bad{border-color:var(--danger);color:var(--danger)}
.chip.neutral{color:var(--muted)}
.ic{width:1.5rem;height:1.5rem;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{padding-top:var(--s4);display:flex;flex-direction:column;gap:var(--s4);min-width:0}
main>*{min-width:0}
/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s3);min-height:52px;padding:var(--s3) var(--s4);border-radius:var(--r-ctl);border:1.5px solid var(--forest);background:var(--surface);color:var(--forest);font-weight:600;text-decoration:none;text-align:left;line-height:1.25}
.btn.block{display:flex;width:100%;justify-content:flex-start}
.btn small{display:block;font-weight:400;font-size:var(--t-xs);opacity:.9;color:var(--muted)}
.btn.primary{background:var(--forest);color:var(--on-forest)}
.btn.primary small{color:var(--on-forest);opacity:.85}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.danger.solid{background:var(--danger);color:var(--bg)}
.btn.danger.solid small{color:var(--bg)}
.btn.sm{min-height:44px;padding:var(--s2) var(--s4);font-size:var(--t-sm)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.icobtn{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;border-radius:var(--r-ctl);border:1.5px solid var(--line);background:var(--surface);color:var(--fg)}
.row{display:flex;gap:var(--s3);flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:var(--s3)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:var(--s3)}
/* superfícies */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:var(--s4);min-width:0}
.panel>h2,.panel>h3{margin-bottom:var(--s2)}
.muted{color:var(--muted);font-size:var(--t-sm)}
.small{font-size:var(--t-xs);color:var(--muted)}
.list{display:flex;flex-direction:column}
.list>*{padding:var(--s3) 0;border-top:1px solid var(--line)}
.list>*:first-child{border-top:0}
ul.clean{margin:0;padding-left:1.25rem;display:flex;flex-direction:column;gap:var(--s2)}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:var(--s2) var(--s4);margin:0}
dl.facts dt{color:var(--muted);font-size:var(--t-sm)}dl.facts dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
/* mensagens (sempre com ícone e título) */
.msg{display:flex;gap:var(--s3);align-items:flex-start;border:1.5px solid var(--line);border-left-width:6px;background:var(--surface);border-radius:var(--r-ctl);padding:var(--s3) var(--s4)}
.msg .ic{margin-top:1px}
.msg b{display:block}
.msg>div{min-width:0}
.msg.ok{border-color:var(--ok)}.msg.ok>.ic{color:var(--ok)}
.msg.warn{border-color:var(--warn)}.msg.warn>.ic{color:var(--warn)}
.msg.bad{border-color:var(--danger)}.msg.bad>.ic{color:var(--danger)}
.msg.info{border-color:var(--info)}.msg.info>.ic{color:var(--info)}
.msg .row{margin-top:var(--s2)}
/* etiquetas */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:var(--t-xs);font-weight:600;border-radius:8px;padding:2px 8px;border:1px solid var(--line);background:var(--surface2);margin:0 var(--s1) var(--s1) 0}
.tag svg{width:14px;height:14px}
.tag.ok{border-color:var(--ok);color:var(--ok);background:transparent}
.tag.warn{border-color:var(--warn);color:var(--warn);background:transparent}
.tag.bad{border-color:var(--danger);color:var(--danger);background:transparent}
.tag.info{border-color:var(--info);color:var(--info);background:transparent}
/* mapa */
.mv{position:relative;overflow:hidden;background:var(--map-bg);border:1px solid var(--line);border-radius:var(--r-card);touch-action:none;user-select:none;-webkit-user-select:none;height:min(62vh,460px);min-height:300px}
.mv.small{height:clamp(260px,44vh,340px)}
.mv:focus-visible{outline-offset:-3px}
.mv-tiles{position:absolute;inset:0;overflow:hidden}
.mv-tiles img{position:absolute;left:0;top:0;width:256px;height:256px;max-width:none;pointer-events:none}
.mv-vec{position:absolute;inset:0;width:100%;height:100%}
.mv-ctrl{position:absolute;right:var(--s2);top:var(--s2);display:flex;flex-direction:column;gap:var(--s2)}
.mv-ctrl .icobtn{box-shadow:0 1px 3px rgba(0,0,0,.25)}
.mv-note{position:absolute;left:var(--s2);right:60px;top:var(--s2);font-size:var(--t-xs);font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-ctl);padding:var(--s2) var(--s3);display:none}
.mv-note.on{display:block}
.mv-attr{position:absolute;left:var(--s2);bottom:var(--s2);right:var(--s2);font-size:11px;color:var(--muted);pointer-events:none;display:flex;justify-content:flex-end}
.mv-attr span{background:var(--surface);border-radius:6px;padding:1px 6px;opacity:.92}
.mv-over{position:absolute;left:var(--s3);right:var(--s3);bottom:var(--s3);z-index:2}
.mapwrap{position:relative;cursor:pointer}
main:focus{outline:none}
.toggles{display:flex;flex-wrap:wrap;gap:var(--s2)}
.toggles label{display:inline-flex;align-items:center;gap:var(--s2);border:1.5px solid var(--line);border-radius:999px;padding:0 var(--s3);min-height:44px;background:var(--surface);font-size:var(--t-sm)}
.toggles input{width:20px;height:20px;accent-color:var(--forest)}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:var(--s2);font-size:var(--t-sm)}
.legend div{display:flex;align-items:center;gap:var(--s2)}
/* navegação */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px));z-index:19}
nav .in{display:flex;width:100%;max-width:680px;gap:2px}
nav button{flex:1;min-width:0;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:var(--t-xs);font-weight:600;color:var(--muted);min-height:58px;border-radius:var(--r-ctl)}
nav button[aria-current="page"]{color:var(--forest);background:var(--surface2)}
nav button.sos{color:var(--danger)}
/* abas */
.tabs{display:flex;gap:var(--s2);overflow-x:auto;padding-bottom:var(--s1)}
.tabs button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:0 var(--s4);min-height:44px;font-weight:600;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--forest);color:var(--on-forest);border-color:var(--forest)}
/* formulários */
.field{display:flex;flex-direction:column;gap:var(--s2)}
.field>label,.field>.lbl{font-weight:600}
select,textarea,input[type=text]{width:100%;min-height:52px;border:1.5px solid var(--line);border-radius:var(--r-ctl);background:var(--surface);padding:var(--s3)}
textarea{min-height:120px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--forest);min-height:36px}
input[type=file]{width:100%}
.check{display:flex;align-items:flex-start;gap:var(--s3);width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-ctl);padding:var(--s3) var(--s4);min-height:60px}
.check .box{width:28px;height:28px;border-radius:8px;border:2.5px solid var(--forest);flex:none;display:flex;align-items:center;justify-content:center;color:var(--on-forest)}
.check[aria-checked="true"]{border-color:var(--ok);background:var(--surface2)}
.check[aria-checked="true"] .box{background:var(--forest)}
.bar{height:12px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.bar span{display:block;height:100%;width:0;background:var(--forest);transition:width .2s}
.photo{max-width:100%;max-height:220px;border-radius:var(--r-ctl);border:1px solid var(--line);display:block}
details.ficha{border:1px solid var(--line);border-radius:var(--r-ctl);padding:0 var(--s4);background:var(--surface)}
details.ficha summary{min-height:48px;display:flex;align-items:center;cursor:pointer;font-weight:600}
details.ficha[open]{padding-bottom:var(--s4)}
.coords{font-family:var(--font-display);font-weight:800;font-size:var(--t-lg);overflow-wrap:anywhere}
/* ilustrações */
.scene{border-radius:var(--r-card);overflow:hidden;border:1px solid var(--line);position:relative;background:var(--surface2)}
.scene svg{display:block;width:100%;height:auto;max-height:190px}
.scene span{position:absolute;right:10px;bottom:8px;font-size:var(--t-xs);font-weight:600;background:var(--surface);color:var(--muted);border-radius:6px;padding:2px 8px}
.item{display:flex;gap:var(--s4);align-items:flex-start}
.item>div{min-width:0}
.art{width:64px;height:64px;flex:none;background:var(--surface2);border-radius:var(--r-ctl)}
.quiz button.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-ctl);padding:var(--s3);margin-top:var(--s2);min-height:52px}
.quiz button.opt.right{border-color:var(--ok)}.quiz button.opt.wrong{border-color:var(--danger)}
/* toast */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(5.5rem + env(safe-area-inset-bottom,0px));z-index:25;max-width:min(92vw,520px);pointer-events:none}
#toast .msg{box-shadow:0 2px 10px rgba(0,0,0,.3);pointer-events:auto}
.spin{width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--forest);border-radius:50%;animation:sp .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.bar span{transition:none}.spin{animation-duration:2.4s}}
</style>

</head>
<body>
<a class="skip" href="#app">Ir para o conteúdo</a>
<div class="wrap">
  <header>
    <div class="hrow">
      <div class="brand">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M2 27 12 9l5 8 4-6 9 16Z"/><path d="M12 9l-2 4M21 11l-1.5 2.5"/></svg>
        Serra Safe
      </div>
      <div class="hbtns">
        <button class="icobtn" id="themeBtn" type="button" aria-label="Alternar tema claro ou escuro" style="padding:0 12px;font-size:.8125rem;font-weight:600">Tema</button>
        <button class="icobtn" type="button" data-act="go" data-arg="settings" aria-label="Ajustes" style="padding:0 12px;font-size:.8125rem;font-weight:600">Ajustes</button>
      </div>
    </div>
    <div class="status" id="status" aria-label="Estado do aplicativo"></div>
  </header>
  <div id="live" aria-live="polite"></div>
  <main id="app" tabindex="-1"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<nav aria-label="Navegação principal"><div class="in" id="nav"></div></nav>
<script src="app.js"></script>
</body>
</html>
